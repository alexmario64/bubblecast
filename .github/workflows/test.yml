name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # The natural-voice test downloads Piper and one Spanish voice (about 85 MB); keep them between runs.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/piper
          key: piper-2023.11.14-2-es_MX-claude-high
      - run: pnpm exec playwright install chromium
      - run: pnpm test
        env:
          BUBBLECAST_PIPER_CACHE: ${{ runner.temp }}/piper
